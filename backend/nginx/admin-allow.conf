# ユーザー管理API（/api/v1/users。アカウントの作成・削除・パスワード再設定）に届いてよい接続元（2026-11-16）。
# 管理者かどうかの判定はAPI側（clab_admins だけ）でも行うが、ここで「届く範囲」も絞って二重にする。
# 既定は、サーバーの手元と社内・学内のプライベートなネットワークだけ。インターネットからは届かない。
# 管理者のIPだけに絞るなら、下の行を消して、自分のアドレスを書く（例：allow 192.168.10.5;）。
# 編集したら、コンテナ方式は `docker compose -f backend/compose/compose.yaml restart nginx`、
# 従来の方式は `sudo systemctl reload nginx`（従来方式は /etc/nginx/fnl-admin-allow.conf を編集）。
allow 127.0.0.0/8;
allow ::1;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
allow fc00::/7;
deny all;
