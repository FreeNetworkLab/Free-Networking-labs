# プッシュ・PRのたびに、テストと型チェックを自動で動かす（2026-10-15）。
# コンテナ（Docker）やサーバーが要る確認は対象外で、実機で行う（設計メモ（非公開））。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend（型・lint・テスト・ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 型チェック（tsc）
        run: npx tsc -b
      - name: lint
        run: npm run lint
      - name: テスト
        run: npm test
      - name: 本番ビルド
        run: npm run build

  compose:
    name: compose（設定の検証・イメージのタグの一致）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 画面とcomposeのイメージのタグがそろっているか
        run: bash tools/check-image-tags.sh
      - name: compose.yaml（イメージ版）の検証（.env なし）
        run: docker compose --env-file /dev/null -f backend/compose/compose.yaml config -q
      - name: compose.yaml + compose.local.yaml（手元のコード版）の検証
        run: |
          printf 'FNL_UID=1000\nFNL_GID=1000\nJWT_SECRET=x\n' > /tmp/ci.env
          docker compose --env-file /tmp/ci.env -f backend/compose/compose.yaml -f backend/compose/compose.local.yaml config -q

  swcli:
    name: swcli（L2・L3スイッチのCLI）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 静的チェック（pyflakes）
        run: |
          pip install pyflakes
          python -m pyflakes backend/l2switch/swcli.py backend/l2switch/l3.py backend/l2switch/acl.py backend/l2switch/test_swcli.py backend/l2switch/test_l3.py backend/l2switch/test_acl.py
      - name: テスト
        working-directory: backend/l2switch
        run: python -m unittest -v test_swcli test_l3 test_acl

  backend-js:
    name: backend（Nodeのプロキシの構文）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 構文チェック
        run: |
          for f in backend/console-proxy/server.js backend/ovs-helper/server.js backend/capture-proxy/server.js backend/collab-proxy/server.js; do
            node --check "$f" && echo "ok: $f"
          done
      - name: collab-proxyのテスト
        run: node --test
        working-directory: backend/collab-proxy
      - name: capture-proxyのテスト（チケット＋Cookie 認証）
        run: npm ci && node --test
        working-directory: backend/capture-proxy
