# タグ（v0.1.0 など）を push すると、ノードのイメージを GHCR に公開し、配布用の tar.gz を GitHub Release に載せる。
# 初回だけ、GHCR のパッケージ（fnl-frr・fnl-l2switch・fnl-l3switch）を Public にする（Packages の設定画面）。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 置き場の名前とイメージのタグを決める
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "registry=ghcr.io/$owner" >> "$GITHUB_OUTPUT"
          echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # タグは frontend/src/types/lab.ts と同じものを使う（install.sh も同じ場所を読む）
          echo "frr=$(grep -oE 'fnl/frr:[0-9]+' frontend/src/types/lab.ts | head -1 | cut -d: -f2)" >> "$GITHUB_OUTPUT"
          echo "l2=$(grep -oE 'fnl/l2switch:[0-9]+' frontend/src/types/lab.ts | head -1 | cut -d: -f2)" >> "$GITHUB_OUTPUT"
          echo "l3=$(grep -oE 'fnl/l3switch:[0-9]+' frontend/src/types/lab.ts | head -1 | cut -d: -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: ルーターのイメージ
        uses: docker/build-push-action@v6
        with:
          context: backend/frr-router
          push: true
          tags: ${{ steps.meta.outputs.registry }}/fnl-frr:${{ steps.meta.outputs.frr }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-2.0-or-later AND GPL-2.0-only AND ISC AND MIT
            org.opencontainers.image.description=Free-Networking-labs のノードのイメージ（ソースとライセンスは source のリポジトリを参照）
      - name: L2スイッチのイメージ
        uses: docker/build-push-action@v6
        with:
          context: backend/l2switch
          push: true
          tags: ${{ steps.meta.outputs.registry }}/fnl-l2switch:${{ steps.meta.outputs.l2 }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-2.0-or-later AND GPL-2.0-only AND ISC AND MIT
            org.opencontainers.image.description=Free-Networking-labs のノードのイメージ（ソースとライセンスは source のリポジトリを参照）
      - name: L3スイッチのイメージ
        uses: docker/build-push-action@v6
        with:
          context: backend/l2switch
          file: backend/l2switch/Dockerfile.l3
          build-args: BASE=${{ steps.meta.outputs.registry }}/fnl-l2switch:${{ steps.meta.outputs.l2 }}
          push: true
          tags: ${{ steps.meta.outputs.registry }}/fnl-l3switch:${{ steps.meta.outputs.l3 }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-2.0-or-later AND GPL-2.0-only AND ISC AND MIT
            org.opencontainers.image.description=Free-Networking-labs のノードのイメージ（ソースとライセンスは source のリポジトリを参照）
      - name: 配布用の tar.gz を作る
        run: bash tools/make-dist.sh "${{ steps.meta.outputs.ver }}" "${{ steps.meta.outputs.registry }}" dist-out
      - name: Release に載せる
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist-out/* --title "$GITHUB_REF_NAME" --generate-notes
